# Compression for the Cordon vhosts.
#
# `nginx.conf` on this box has `gzip on;` with `gzip_types` left commented out,
# which is the stock Ubuntu file. The default for `gzip_types` is `text/html`
# and nothing else, so `gzip on` on its own compresses documents and leaves
# every script and stylesheet alone. The console's entry bundle went over the
# wire at **2,690,804 bytes** — the build reports 788 kB gzipped for the same
# file, so better than two thirds of it was avoidable and nobody had measured
# it.
#
# Set here, per server, rather than by uncommenting the http-context default:
# nine other sites share this nginx, and their compression is not this repo's
# to change. A directive in a `server` block overrides the http one for that
# server and touches nothing else.
#
# `gzip_vary` matters because the assets are served `immutable` for a year.
# Without a `Vary: Accept-Encoding` a shared cache can hand a compressed body
# to a client that did not ask for one, and the year is how long it keeps
# doing that.
gzip on;
gzip_vary on;
gzip_comp_level 6;

# From 1 kB. Below that the gzip header costs more than the saving, and a
# 402 challenge is a few hundred bytes.
gzip_min_length 1024;

# `gzip_proxied any` because the meter and attest are proxied, and by default
# nginx will not compress a response it proxied.
gzip_proxied any;

# Only what actually shrinks. Images, video and fonts in this project are
# already compressed formats, and gzipping them spends CPU to add bytes.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;
