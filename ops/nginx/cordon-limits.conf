# Rate limiting for the Cordon vhosts only. Written 2026-09-12.
#
# The zone lives here, in conf.d, rather than beside the `limit_req` that uses
# it, because `limit_req_zone` is http-context and a vhost file is
# server-context. It also has to be declared exactly once: a vhost included
# twice — a stray second symlink in sites-enabled, which is a thing that
# happens — would be a duplicate zone and a hard nginx failure, and on this box
# that takes down nine unrelated sites and not just this one. The Ramalogy
# vhosts on the same box learned this in August and their file says so too.
#
# Declaring a zone costs nothing until a `limit_req` in some location names it,
# so nothing here can affect a site that does not.
#
# 10r/s with burst=20 nodelay. What this protects is not the money — a payment
# is bounded by the payer's own signature and by the token — but the work done
# before one: every request carrying a payment header costs an ECDSA recovery
# and an `eth_call` simulation against a public RPC that rate-limits this box
# for asking too often. An agent buying several answers in a row is the
# ordinary case and stays well inside the burst.
limit_req_zone $binary_remote_addr zone=cordon_attest:10m rate=10r/s;
