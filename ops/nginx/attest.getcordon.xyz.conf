# The attest endpoint, on its own name.
#
# Two reasons it is not a path on the origin. The site already owns
# /attest/:id as a page — the human-readable version of the same record — and
# the documentation shipped the subdomain in its curl sample before any of
# this existed, so the name is already written down.
#
# This is the one surface that takes money. It holds a relayer key and submits
# an EIP-3009 authorisation the payer signed, so it is proxied and never
# exposed directly: the process binds 127.0.0.1 and nginx is the only way in.

server {
    listen 80;
    listen [::]:80;
    server_name attest.getcordon.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cordon;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attest.getcordon.xyz;

    ssl_certificate     /etc/letsencrypt/live/attest.getcordon.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attest.getcordon.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cordon-attest.access.log;
    error_log  /var/log/nginx/cordon-attest.error.log;

    # An x402 flow is one small GET, a 402, and the same GET carrying a
    # signature in a header. Nothing here uploads anything.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8405;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The endpoint collects payment before it writes the answer, and
        # collection is a transaction on Arc. A gateway timeout shorter than
        # settlement returns 504 to a payer whose authorisation was in fact
        # spent, which is the one failure this endpoint is built to avoid.
        proxy_read_timeout 120s;

        # X-PAYMENT is the request and X-PAYMENT-RESPONSE the receipt. Neither
        # is a standard header, so say so explicitly rather than trusting a
        # default to pass them through.
        proxy_pass_request_headers on;
        proxy_set_header X-PAYMENT $http_x_payment;
    }
}
