# The attest endpoint, on its own name.
#
# Two reasons it is not a path on the origin. The site already owns
# /attest/:id as a page — the human-readable version of the same record — and
# the documentation shipped the subdomain in its curl sample before any of
# this existed, so the name is already written down.
#
# This is the one surface that takes money. It holds a relayer key and submits
# an EIP-3009 authorisation the payer signed, so it is proxied and never
# exposed directly: the process binds 127.0.0.1 and nginx is the only way in.

# A rate at which the free half of this endpoint can be asked.
#
# `http` context, so it sits outside the server blocks: this file is included
# from inside `http` by sites-enabled. The zone is shared across workers and
# 10m holds on the order of 160,000 addresses.
#
# What it protects is not the money. A payment is bounded by the payer's own
# signature and by the token. It is the work done before one: every request
# with a header on it costs an ECDSA recovery and an `eth_call` simulation
# against a public RPC that rate-limits this box for asking too often — so an
# unpaid caller can spend the endpoint's RPC budget and take the paid path down
# with it.
limit_req_zone $binary_remote_addr zone=cordon_attest:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name attest.getcordon.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cordon;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attest.getcordon.xyz;

    ssl_certificate     /etc/letsencrypt/live/attest.getcordon.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attest.getcordon.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cordon-attest.access.log;
    error_log  /var/log/nginx/cordon-attest.error.log;

    # An x402 flow is one small GET, a 402, and the same GET carrying a
    # signature in a header. Nothing here uploads anything.
    client_max_body_size 16k;

    location / {
        # A burst, because an agent buying several answers in a row is the
        # ordinary case and the shape this is built for. `nodelay` serves the
        # burst immediately rather than smoothing it into a queue, which on a
        # paying path reads as the endpoint being slow.
        limit_req zone=cordon_attest burst=20 nodelay;
        # 429, not 503: a caller that is being asked to slow down should be
        # told that and not told the endpoint is broken.
        limit_req_status 429;

        include /etc/nginx/snippets/cordon-headers.conf;
        proxy_pass http://127.0.0.1:8405;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The endpoint collects payment before it writes the answer, and
        # collection is a transaction on Arc. A gateway timeout shorter than
        # settlement returns 504 to a payer whose authorisation was in fact
        # spent, which is the one failure this endpoint is built to avoid.
        proxy_read_timeout 120s;

        # X-PAYMENT is the request and X-PAYMENT-RESPONSE the receipt. Neither
        # is a standard header, so say so explicitly rather than trusting a
        # default to pass them through.
        proxy_pass_request_headers on;
        proxy_set_header X-PAYMENT $http_x_payment;
    }
}
