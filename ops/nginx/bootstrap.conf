# Stage one, and it is deleted in stage two.
#
# The real configuration references certificates under
# /etc/letsencrypt/live/getcordon.xyz/, and nginx refuses to start when they
# are absent — so it cannot be installed before they are issued, and they
# cannot be issued without a server that answers the ACME challenge on port
# 80. This file is that server and nothing more.
#
# It serves the site over plain HTTP as well, deliberately: it means the
# deployment can be checked end to end before DNS or a certificate exists,
# with `curl -H 'Host: getcordon.xyz' http://<box IP>/`.
#
# Not `default_server`. This box's `default` site already claims that on :80
# and a second claim fails `nginx -t` outright with "a duplicate default
# server" — which is the good outcome, but only if you find out before the
# reload rather than during it.

server {
    listen 80;
    listen [::]:80;
    server_name getcordon.xyz www.getcordon.xyz attest.getcordon.xyz;

    root /var/www/cordon;
    index index.html;

    access_log /var/log/nginx/cordon.access.log;
    error_log  /var/log/nginx/cordon.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cordon;
        default_type "text/plain";
    }

    location = /console { return 301 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /        { try_files $uri $uri/ /index.html; }
}

# The bare address, for checking the deployment before the name resolves.
# Port 80 by IP belongs to this box's `default` site and is not ours to take,
# so this listens beside it. A browser pointed at http://<box IP>:9081/
# reaches the real bundle, with the real base paths, over the real nginx
# fallbacks — which is the only way to catch a build that works from `vite
# dev` and not from `/var/www`.
#
# 9081, not 9080: another site on this box already serves 9080 with
# `server_name _`, so a second block there is "conflicting server name,
# ignored" (a warning nginx does not fail on) and every check hits that site
# instead. Both of them answer / and /console/ with a 200, so the check
# passes and proves nothing. Grep the box for a port before claiming one.
#
# It goes away with this file, in stage two.
server {
    listen 9081;
    listen [::]:9081;
    server_name _;

    root /var/www/cordon;
    index index.html;

    access_log /var/log/nginx/cordon.access.log;
    error_log  /var/log/nginx/cordon.error.log;

    location = /console { return 301 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /        { try_files $uri $uri/ /index.html; }
}
