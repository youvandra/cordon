# Everything the origin serves, written once.
#
# Only one server block includes this today. It is a snippet anyway because
# another project on this box learned the other way round: two copies of a
# location list drift within a week, and the failure is a route that works on
# one name and 404s on the other, which nobody checks because the page they
# look at is fine.

    # A redeploy changes the asset hashes and leaves index.html where it was.
    # nginx sends no Cache-Control of its own, which leaves a browser free to
    # keep the old shell on heuristics alone: a returning visitor then runs a
    # build that was replaced, naming assets the next deploy may not carry.
    # Documents revalidate; only the hashed assets under /assets/ are kept.
    include /etc/nginx/snippets/cordon-headers.conf;
    add_header Cache-Control "no-cache" always;

    location /assets/ {
        # Repeated rather than inherited: a `location` with an `add_header` of
        # its own gets none of the ones above it.
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /console/assets/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The meter's read API. Same origin so the console needs no CORS, and
    # prefix-stripped by the trailing slash on proxy_pass, because the meter
    # serves /health, /tree/:root, /node/:node, /agent/:id and /refusal/:id at
    # its own root. It cannot be mounted at the origin root: /agent/:id and
    # /refusal/:id are pages this site owns, and the chain points at the
    # pages, not at the JSON.
    #
    # 502 rather than a stub when the meter is down. A read API that invents a
    # reply is worse than one that is honestly missing, and the whole project
    # is that argument.
    # Arc's meter, kept reachable under its own path. Every record Arc's
    # ConductRecord ever wrote points at /refusal/<id> on this origin, and
    # those ids are that contract's — Sepolia's refusal 1 is a different
    # event with the same URL. Moving /api to Sepolia without this would
    # make every Arc record resolve to the wrong chain's refusal or to
    # nothing, which is the exact defect this project exists to point at.
    #
    # More specific than the /api/ block below, so nginx matches it first.
    location /api/arc/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:8404/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Sepolia's meter, and the one /api means now: it is the chain the names
    # are on, the chain the console reads, and the chain the demo runs on.
    location /api/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:8407/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Beacon, the catalogue seller, on a path rather than a name of its own.
    #
    # `attest` and `demo-seller` each got a vhost because their URLs were
    # already written down before the endpoint existed — the docs shipped
    # attest's curl sample first. Nothing has published Beacon's, so it costs a
    # path here rather than a certificate and a DNS record, and it can go up
    # without waiting for either.
    #
    # The trailing slash on `proxy_pass` is what makes that work. Beacon serves
    # its catalogue at its own root — /v1/signal/btc and the rest — so the
    # prefix has to come off on the way through. Its 402 then names `resource`
    # as the path it saw, which is the stripped one. That is harmless and worth
    # stating: an x402 payer signs an amount and a payee, never a path, and
    # nothing on either side compares the two.
    #
    # More specific than `location /` below, which is what makes nginx choose
    # it — the longest matching prefix wins regardless of the order they are
    # written in.
    location /market/ {
        # Beacon takes money, so it gets the same limiter as the other two
        # sellers. What this protects is the work done before a payment, not
        # the payment: every request carrying a payment header costs an ECDSA
        # recovery and an `eth_call` against an RPC that rate-limits this box.
        limit_req zone=cordon_attest burst=20 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;

        proxy_pass http://127.0.0.1:8409/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Collection is a transaction. A shorter timeout returns 504 to a payer
        # whose authorisation has already been spent, which is the one failure
        # here that costs somebody money.
        proxy_read_timeout 120s;

        # Beacon reads either spelling of the payment header, so both are
        # forwarded. They are named explicitly because a `proxy_set_header`
        # anywhere in a location replaces the whole inherited set rather than
        # adding to it — the same trap as `add_header` above.
        proxy_pass_request_headers on;
        proxy_set_header X-PAYMENT $http_x_payment;
        proxy_set_header Payment-Signature $http_payment_signature;
    }

    # The catalogue is a page an agent is pointed at, and without this a
    # request for /market falls through to the site shell and renders the
    # not-found page rather than the seller.
    location = /market { return 301 /market/; }

    # Without the trailing slash the browser resolves the console's assets
    # against the origin root and loads nothing.
    location = /console { return 301 /console/; }

    # The console is a single page and owns every path beneath it. Its routes
    # are written as /console/... in the app, and its bundle is built with
    # base /console/, so this fallback is the whole of its routing.
    location /console/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /console/index.html;
    }

    # The site is a single page too, and it owns the rest: /docs/:slug,
    # /agent/:id, /attest/:id, /refusal/:id and /drill are all resolved in the
    # browser. A real file wins first so /og-image.png and the icons are
    # served rather than swallowed by the shell.
    location / {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
