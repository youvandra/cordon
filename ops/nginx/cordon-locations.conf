# Everything the origin serves, written once.
#
# Only one server block includes this today. It is a snippet anyway because
# another project on this box learned the other way round: two copies of a
# location list drift within a week, and the failure is a route that works on
# one name and 404s on the other, which nobody checks because the page they
# look at is fine.

    # A redeploy changes the asset hashes and leaves index.html where it was.
    # nginx sends no Cache-Control of its own, which leaves a browser free to
    # keep the old shell on heuristics alone: a returning visitor then runs a
    # build that was replaced, naming assets the next deploy may not carry.
    # Documents revalidate; only the hashed assets under /assets/ are kept.
    include /etc/nginx/snippets/cordon-headers.conf;
    add_header Cache-Control "no-cache" always;

    location /assets/ {
        # Repeated rather than inherited: a `location` with an `add_header` of
        # its own gets none of the ones above it.
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /console/assets/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The meter's read API. Same origin so the console needs no CORS, and
    # prefix-stripped by the trailing slash on proxy_pass, because the meter
    # serves /health, /tree/:root, /node/:node, /agent/:id and /refusal/:id at
    # its own root. It cannot be mounted at the origin root: /agent/:id and
    # /refusal/:id are pages this site owns, and the chain points at the
    # pages, not at the JSON.
    #
    # 502 rather than a stub when the meter is down. A read API that invents a
    # reply is worse than one that is honestly missing, and the whole project
    # is that argument.
    location /api/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:8404/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Without the trailing slash the browser resolves the console's assets
    # against the origin root and loads nothing.
    location = /console { return 301 /console/; }

    # The console is a single page and owns every path beneath it. Its routes
    # are written as /console/... in the app, and its bundle is built with
    # base /console/, so this fallback is the whole of its routing.
    location /console/ {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /console/index.html;
    }

    # The site is a single page too, and it owns the rest: /docs/:slug,
    # /agent/:id, /attest/:id, /refusal/:id and /drill are all resolved in the
    # browser. A real file wins first so /og-image.png and the icons are
    # served rather than swallowed by the shell.
    location / {
        include /etc/nginx/snippets/cordon-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
