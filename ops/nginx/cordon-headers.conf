# Headers every Cordon response carries.
#
# In its own file and included from each `location`, because nginx's
# `add_header` does not merge: a `location` that sets one of its own inherits
# NONE of the headers set above it. Both origins have locations that set their
# own `Cache-Control`, so a block of these in the `server` would apply to some
# routes and silently vanish from others — which is the worst of the three
# possible outcomes, since the ones that vanish are the ones nobody checks.
#
# There is no full Content-Security-Policy here and that is deliberate. The
# console loads a wallet SDK that opens its own frames, talks to its own
# origins and evaluates its own code; a policy written without measuring what
# it needs would break signing, which is the one thing on this site that cannot
# be allowed to break quietly. `frame-ancestors` is the half that can be stated
# without measuring anything, and it is the half that matters here.

# The console connects a wallet and carries Revoke and Release. Both are one
# click, both are irreversible, and an owner who can be induced to click them
# inside somebody else's page has lost a branch or a tranche. `frame-ancestors`
# is the modern spelling and `X-Frame-Options` is the one older browsers read.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# A JSON answer this site serves is not a document, and a browser that sniffs
# one into being a document is a browser running somebody's uploaded content
# as a page.
add_header X-Content-Type-Options "nosniff" always;

# A refusal URL names an agent and an amount. It should not travel to whatever
# a record page happens to link out to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Two years, and subdomains — attest.getcordon.xyz is the only one and it is
# already HTTPS-only. Not preloaded: preloading is a submission to a list that
# is slow and awkward to leave, and that is the owner's decision rather than a
# config file's.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
