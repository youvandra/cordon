# The gates, run by a machine rather than remembered.
#
# Every claim this project makes about itself is a number recorded from a run:
# packages/fixtures/src/gates.gen.ts holds the test counts the site prints. Those
# numbers were recorded by hand, so they drifted — the file claimed 66 G1 tests
# against a suite that had grown to 69. A figure nobody re-derives is a figure
# that is eventually wrong, so the derivation lives here.
name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (G1, G4, G5, G6, G8, G9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # solc is downloaded once per runner otherwise, and every contract is
      # recompiled from cold on every push. The key carries the sources, so a
      # contract change invalidates it and forge recompiles what moved; the
      # restore-key keeps the compiler itself across all of them.
      - name: Cache solc and the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            packages/contracts/cache
            packages/contracts/out
          key: forge-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/foundry.toml') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # The Solidity view of packages/fixtures. Generated, never written twice.
      - name: Emit fixtures
        run: node packages/fixtures/scripts/emit-solidity.ts

      # Committed generated files must match what the generator produces. A
      # drifted Fixtures.gen.sol means the tests asserted against figures the
      # rest of the repo no longer holds.
      - name: Generated fixtures are current
        run: git diff --exit-code -- packages/contracts/test/Fixtures.gen.sol

      - name: forge build
        run: forge build --root packages/contracts

      # No `--gas-report`. It used to run as a second pass over the whole
      # suite so a reader could notice a gas regression in the log, and
      # measured here the instrumentation alone takes the suite from ~118s to
      # ~292s. G9 asserts the ceilings now and fails on a regression, which is
      # the same guard by machine rather than by eye — `forge test
      # --gas-report` locally when the table is what you want.
      - name: forge test
        run: forge test --root packages/contracts -vv

      # Re-record every contract gate and fail if the committed numbers
      # disagree. This is the check that was missing: gates.gen.ts is what the
      # site prints as each gate's size, it was recorded by hand, and it had
      # drifted to 66 G1 tests against a suite of 70.
      #
      # One run, read six times. Each recorder used to start its own, so G4's
      # adversarial search ran again for the sake of counting it. The
      # completeness guard is unchanged and still the point: a gate that
      # cannot account for every one of its own files is red, whether the run
      # was its own or shared.
      - name: Gate counts are what the run produced
        working-directory: packages/contracts
        run: |
          forge test --json --offline > gates-run.json
          for gate in G1 G4 G5 G6 G8 G9; do
            CORDON_GATE_REPORT=gates-run.json node scripts/record-gate.mjs "$gate" "test/${gate}_*"
          done
          rm -f gates-run.json
      - name: No gate drift
        run: |
          git diff --exit-code -- packages/fixtures/src/gates.gen.ts \
            || { echo "::error::gates.gen.ts is stale — commit the re-recorded counts"; exit 1; }

  # What a contributor without Foundry installed can run. Keeping this job
  # honest is the point of it: if it ever needs a chain, the split has rotted
  # and the README's claim that 98 of the daemon's tests need no node is no
  # longer true. No Foundry step here, deliberately.
  units:
    name: no-foundry suites (fixtures, console, proxy, verify, daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspaces
        run: npm install --workspaces --include-workspace-root

      - name: Test
        run: npm run test:units

  node:
    name: every node suite, including the ones that start anvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # anvil and forge: the collector and the end-to-end tests run against a
      # real local node rather than a mock of one.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install workspaces
        run: npm install --workspaces --include-workspace-root

      # Built once, here, rather than inside a test's before() hook. A cold
      # forge build plus a solc download does not fit in a test timeout, which
      # is why a clean clone used to fail its first run and pass its second.
      - name: Build contracts for the suites that read the artifacts
        run: |
          node packages/fixtures/scripts/emit-solidity.ts
          forge build --root packages/contracts

      # `abi.gen.ts` is committed so the suites above can run without Foundry.
      # That only holds while the committed copy matches the contracts, so the
      # job with a compiler checks it rather than trusting it.
      - name: The committed ABI is the one the contracts produce
        run: |
          npm run abi --workspace packages/daemon
          git diff --exit-code -- packages/daemon/src/abi.gen.ts

      - name: Test
        run: npm run test:node

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --workspaces --include-workspace-root
      - run: node packages/fixtures/scripts/emit-solidity.ts
      - name: tsc --noEmit across every workspace that has a build
        run: npm run typecheck
