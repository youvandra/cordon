# The gates, run by a machine rather than remembered.
#
# Every claim this project makes about itself is a number recorded from a run:
# packages/fixtures/src/gates.gen.ts holds the test counts the site prints. Those
# numbers were recorded by hand, so they drifted — the file claimed 66 G1 tests
# against a suite that had grown to 69. A figure nobody re-derives is a figure
# that is eventually wrong, so the derivation lives here.
name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (G1, G4, G5, G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The Solidity view of packages/fixtures. Generated, never written twice.
      - name: Emit fixtures
        run: node packages/fixtures/scripts/emit-solidity.ts

      # Committed generated files must match what the generator produces. A
      # drifted Fixtures.gen.sol means the tests asserted against figures the
      # rest of the repo no longer holds.
      - name: Generated fixtures are current
        run: git diff --exit-code -- packages/contracts/test/Fixtures.gen.sol

      - name: forge build
        run: forge build --root packages/contracts

      - name: forge test
        run: forge test --root packages/contracts -vv

      # Refusals are returns, not reverts, and every bound is priced on the hot
      # path. A gas report in the log is how a regression in either gets noticed.
      - name: Gas report
        run: forge test --root packages/contracts --gas-report

  node:
    name: node suites (daemon, attest, meter, proxy, eval, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # anvil and forge: the collector and the end-to-end tests run against a
      # real local node rather than a mock of one.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install workspaces
        run: npm install --workspaces --include-workspace-root

      # Built once, here, rather than inside a test's before() hook. A cold
      # forge build plus a solc download does not fit in a test timeout, which
      # is why a clean clone used to fail its first run and pass its second.
      - name: Build contracts for the suites that read the artifacts
        run: |
          node packages/fixtures/scripts/emit-solidity.ts
          forge build --root packages/contracts

      - name: Test
        run: npm run test:node

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --workspaces --include-workspace-root
      - run: node packages/fixtures/scripts/emit-solidity.ts
      - name: tsc --noEmit across every workspace that has a build
        run: npm run typecheck
